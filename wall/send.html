<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 คืนหลอน · ส่งขึ้นจอ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wall.css">
<style>
.moon{width:min(34vw,160px);right:6%;top:4%}
.wrap{position:relative;z-index:5;max-width:460px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 16px 40px}
h1{font-size:44px;text-align:center}
.sub{text-align:center;font:500 20px "Mitr";color:#fff;margin:4px 0 22px;text-shadow:0 0 20px #a066ff}
form{display:grid;gap:14px}
.pick{position:relative;display:grid;place-items:center;aspect-ratio:4/5;border-radius:22px;border:2px dashed #ff8a2a99;background:var(--card);backdrop-filter:blur(8px);cursor:pointer;overflow:hidden}
.pick svg{width:64px;height:64px;color:var(--orange)}
.pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ig{position:relative}
.ig span{position:absolute;left:16px;top:50%;translate:0 -50%;font:500 17px "Mitr";color:var(--muted)}
.ig .field{padding-left:34px}
textarea.field{resize:none;min-height:96px}
.count{text-align:right;font-size:13px;color:var(--muted);margin-top:-8px}
.done{text-align:center;padding:40px 0}
.done svg{width:92px;height:92px;margin:0 auto 14px}
.done b{display:block;font:600 30px "Mitr";color:var(--orange)}
.done .wait{margin-top:10px;font:500 18px "Mitr";color:var(--muted)}
.done .btn{margin-top:22px}
.err{text-align:center;color:#ff8f9b;min-height:1.2em}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="title">100 คืนหลอน</h1>
  <div class="sub">ขึ้นจอ</div>

  <form id="f">
    <label class="pick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="4"/></svg>
      <img id="prev" alt="" hidden>
      <input id="file" type="file" accept="image/*" required>
    </label>
    <div class="ig"><span>@</span><input class="field" id="ig" maxlength="30" placeholder="IG" autocomplete="off" autocapitalize="off"></div>
    <textarea class="field" id="quote" maxlength="120" placeholder="คำคม"></textarea>
    <div class="count" id="count">0/120</div>
    <button class="btn" id="send">ส่งขึ้นจอ</button>
    <div class="err" id="err"></div>
  </form>

  <div class="done" id="done" hidden>
    <svg viewBox="0 0 100 90"><rect x="46" y="2" width="8" height="16" rx="3" fill="#3d7a2a"/><ellipse cx="30" cy="54" rx="24" ry="33" fill="#e8610c"/><ellipse cx="70" cy="54" rx="24" ry="33" fill="#e8610c"/><ellipse cx="50" cy="54" rx="24" ry="35" fill="#ff7f1f"/><path d="M30 42l10 10H22zM70 42l8 10H60zM28 64q22 18 44 0l-6 8-6-6-6 8-6-8-6 8-6-6z" fill="#3a1a05"/></svg>
    <b>ส่งแล้ว</b>
    <div class="wait" id="wait"></div>
    <button class="btn" id="again" hidden>ส่งอีก</button>
  </div>
</main>

<script src="deco.js"></script>
<script type="module">
import { db } from './fb.js';
import { ref, push } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const COOLDOWN_MS = 3 * 60_000;
const $ = (s) => document.querySelector(s);
let img = '';

// Shrink on the phone so the upload is small; the original never leaves the device.
async function shrink(file) {
  const url = URL.createObjectURL(file);
  const el = new Image();
  el.src = url;
  await el.decode();
  const s = Math.min(1, 1000 / Math.max(el.naturalWidth, el.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(el.naturalWidth * s);
  c.height = Math.round(el.naturalHeight * s);
  c.getContext('2d').drawImage(el, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  let out = c.toDataURL('image/jpeg', .78);
  if (out.length > 450_000) out = c.toDataURL('image/jpeg', .55);
  return out;
}

$('#file').onchange = async () => {
  const f = $('#file').files[0];
  if (!f) return;
  $('#err').textContent = '';
  try {
    img = await shrink(f);
    $('#prev').src = img;
    $('#prev').hidden = false;
  } catch {
    img = '';
    $('#err').textContent = 'เปิดรูปนี้ไม่ได้';
  }
};
$('#quote').oninput = () => { $('#count').textContent = `${$('#quote').value.length}/120`; };

function lastSent() {
  try { return +localStorage.getItem('wall-sent') || 0; } catch { return 0; }
}

let tick;
function showDone() {
  $('#f').hidden = true;
  $('#done').hidden = false;
  clearInterval(tick);
  const upd = () => {
    const left = lastSent() + COOLDOWN_MS - Date.now();
    if (left <= 0) {
      clearInterval(tick);
      $('#wait').textContent = '';
      $('#again').hidden = false;
      return;
    }
    $('#again').hidden = true;
    const s = Math.ceil(left / 1000);
    $('#wait').textContent = `ส่งใหม่ได้ใน ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };
  upd();
  tick = setInterval(upd, 1000);
}

$('#again').onclick = () => {
  img = '';
  $('#f').reset();
  $('#prev').hidden = true;
  $('#count').textContent = '0/120';
  $('#done').hidden = true;
  $('#f').hidden = false;
};

$('#f').onsubmit = async (e) => {
  e.preventDefault();
  if (!img) { $('#err').textContent = 'เลือกรูปก่อน'; return; }
  $('#send').disabled = true;
  $('#err').textContent = '';
  try {
    await push(ref(db, 'inbox'), {
      img,
      ig: $('#ig').value.trim().replace(/^@+/, '').slice(0, 30),
      quote: $('#quote').value.trim().slice(0, 120),
    });
    try { localStorage.setItem('wall-sent', Date.now()); } catch {}
    showDone();
  } catch {
    $('#err').textContent = 'ส่งไม่สำเร็จ ลองใหม่อีกครั้ง';
  } finally {
    $('#send').disabled = false;
  }
};

if (Date.now() - lastSent() < COOLDOWN_MS) showDone();
</script>
</body>
</html>
