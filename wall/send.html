<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 คืนหลอน · ส่งขึ้นจอ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wall.css">
<style>
.moon{position:absolute;width:64px;right:22px;top:calc(76px + env(safe-area-inset-top,0px));box-shadow:0 0 40px 12px #ff8a2a66}
.c3{top:18%}.c4{right:4%;top:auto;bottom:22%}
.wrap{position:relative;z-index:5;max-width:460px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 16px 40px}
h1{font-size:44px;text-align:center}
.sub{text-align:center;font:500 20px "Mitr";color:#fff;margin:4px 0 22px;text-shadow:0 0 20px #a066ff}
form{display:grid;gap:14px}
.pick{position:relative;display:grid;place-items:center;aspect-ratio:4/5;border-radius:22px;border:2px dashed #ff8a2a99;background:var(--card);backdrop-filter:blur(8px);cursor:pointer;overflow:hidden;transition:border-color .3s}
.pick.bad{border-color:#ff5468;animation:shake .4s}
.pick svg{width:64px;height:64px;color:var(--orange);animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}15%{transform:rotate(-12deg) scale(1.1)}30%{transform:rotate(10deg) scale(1.1)}45%{transform:rotate(-6deg)}60%{transform:rotate(0) scale(1)}}
.pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ic{position:relative}
.ic svg{position:absolute;left:14px;top:50%;width:22px;height:22px;translate:0 -50%;color:var(--muted)}
.ic .field{padding-left:46px}
.field.bad{border-color:#ff5468;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
textarea.field{resize:none;min-height:96px}
.count{text-align:right;font-size:13px;color:var(--muted);margin-top:-8px}
.btn{animation:jelly 2.4s ease-in-out infinite}
.btn:disabled{animation:none}
@keyframes jelly{0%,70%,100%{transform:scale(1,1)}76%{transform:scale(1.06,.92)}82%{transform:scale(.95,1.05)}88%{transform:scale(1.03,.97)}}
.done{text-align:center;padding:40px 0}
.done svg{width:110px;height:110px;margin:0 auto 14px;animation:dance .9s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(-12deg) translateY(0)}50%{transform:rotate(12deg) translateY(-14px)}}
.done b{display:block;font:600 30px "Mitr";color:var(--orange)}
.done .wait{margin-top:10px;font:500 18px "Mitr";color:var(--muted)}
.done .btn{margin-top:22px}
.err{text-align:center;color:#ff8f9b;min-height:1.2em}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="title wave">100 คืนหลอน</h1>
  <div class="sub">ขึ้นจอ</div>

  <form id="f" novalidate>
    <label class="pick" id="pick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="4"/></svg>
      <img id="prev" alt="" hidden>
      <input id="file" type="file" accept="image/*">
    </label>
    <div class="ic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
      <input class="field" id="nick" maxlength="40" placeholder="ชื่อที่ต้องการให้แสดง" autocomplete="off">
    </div>
    <div class="ic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
      <input class="field" id="ig" maxlength="30" placeholder="IG (ไม่บังคับ)" autocomplete="off" autocapitalize="off">
    </div>
    <div class="ic">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.8v3h2.6V21z"/></svg>
      <input class="field" id="fb" maxlength="40" placeholder="Facebook (ไม่บังคับ)" autocomplete="off">
    </div>
    <textarea class="field" id="quote" maxlength="120" placeholder="เช่น ผีเดียวที่เป็นได้ คือผีน้อง"></textarea>
    <div class="count" id="count">0/120</div>
    <button class="btn" id="send">ส่งขึ้นจอ</button>
    <div class="err" id="err"></div>
  </form>

  <div class="done" id="done" hidden>
    <svg viewBox="0 0 100 90"><rect x="46" y="2" width="8" height="16" rx="3" fill="#3d7a2a"/><ellipse cx="30" cy="54" rx="24" ry="33" fill="#e8610c"/><ellipse cx="70" cy="54" rx="24" ry="33" fill="#e8610c"/><ellipse cx="50" cy="54" rx="24" ry="35" fill="#ff7f1f"/><path d="M30 42l10 10H22zM70 42l8 10H60zM28 64q22 18 44 0l-6 8-6-6-6 8-6-8-6 8-6-6z" fill="#3a1a05"/></svg>
    <b>ส่งแล้ว</b>
    <div class="wait" id="wait"></div>
    <button class="btn" id="again" hidden>ส่งอีก</button>
  </div>
</main>

<script src="deco.js"></script>
<script type="module">
import { db } from './fb.js';
import { ref, push } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const COOLDOWN_MS = 3 * 60_000;
const $ = (s) => document.querySelector(s);
let img = '';

// Shrink on the phone so the upload is small; the original never leaves the device.
async function shrink(file) {
  const url = URL.createObjectURL(file);
  const el = new Image();
  el.src = url;
  await el.decode();
  const s = Math.min(1, 1000 / Math.max(el.naturalWidth, el.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(el.naturalWidth * s);
  c.height = Math.round(el.naturalHeight * s);
  c.getContext('2d').drawImage(el, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  let out = c.toDataURL('image/jpeg', .78);
  if (out.length > 450_000) out = c.toDataURL('image/jpeg', .55);
  return out;
}

function flag(el) {
  el.classList.remove('bad');
  void el.offsetWidth;
  el.classList.add('bad');
}
document.querySelectorAll('.field').forEach((el) => el.addEventListener('input', () => el.classList.remove('bad')));

$('#file').onchange = async () => {
  const f = $('#file').files[0];
  if (!f) return;
  $('#err').textContent = '';
  $('#pick').classList.remove('bad');
  try {
    img = await shrink(f);
    $('#prev').src = img;
    $('#prev').hidden = false;
  } catch {
    img = '';
    $('#err').textContent = 'เปิดรูปนี้ไม่ได้';
  }
};
$('#quote').oninput = () => { $('#count').textContent = `${$('#quote').value.length}/120`; };

function lastSent() {
  try { return +localStorage.getItem('wall-sent') || 0; } catch { return 0; }
}

let tick;
function showDone() {
  $('#f').hidden = true;
  $('#done').hidden = false;
  clearInterval(tick);
  const upd = () => {
    const left = lastSent() + COOLDOWN_MS - Date.now();
    if (left <= 0) {
      clearInterval(tick);
      $('#wait').textContent = '';
      $('#again').hidden = false;
      return;
    }
    $('#again').hidden = true;
    const s = Math.ceil(left / 1000);
    $('#wait').textContent = `ส่งใหม่ได้ใน ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };
  upd();
  tick = setInterval(upd, 1000);
}

$('#again').onclick = () => {
  img = '';
  $('#f').reset();
  $('#prev').hidden = true;
  $('#count').textContent = '0/120';
  $('#done').hidden = true;
  $('#f').hidden = false;
};

$('#f').onsubmit = async (e) => {
  e.preventDefault();
  const data = {
    img,
    nick: $('#nick').value.trim().slice(0, 40),
    ig: $('#ig').value.trim().replace(/^@+/, '').slice(0, 30),
    fb: $('#fb').value.trim().slice(0, 40),
    quote: $('#quote').value.trim().slice(0, 120),
  };
  if (!img) {
    flag($('#pick'));
    $('#err').textContent = 'ใส่รูปก่อน';
    return;
  }
  if (!data.nick && !data.ig && !data.fb) {
    flag($('#nick'));
    $('#nick').focus();
    $('#err').textContent = 'กรอกชื่อที่ต้องการให้แสดง';
    return;
  }
  $('#send').disabled = true;
  $('#err').textContent = '';
  try {
    await push(ref(db, 'inbox'), data);
    try { localStorage.setItem('wall-sent', Date.now()); } catch {}
    showDone();
  } catch {
    $('#err').textContent = 'ส่งไม่สำเร็จ ลองใหม่อีกครั้ง';
  } finally {
    $('#send').disabled = false;
  }
};

if (Date.now() - lastSent() < COOLDOWN_MS) showDone();
</script>
</body>
</html>
