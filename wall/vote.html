<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 คืนหลอน · โหวตชุดแฟนซี</title>
<script>
  // LINE's in-app browser keeps its own storage; send voters to their real browser so one phone = one vote.
  if (/ Line\//i.test(navigator.userAgent) && !/[?&]openExternalBrowser=1/.test(location.search)) {
    const u = new URL(location.href);
    u.searchParams.set('openExternalBrowser', '1');
    location.replace(u.href);
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wall.css">
<style>
.moon{position:absolute;width:64px;right:22px;top:calc(76px + env(safe-area-inset-top,0px));box-shadow:0 0 40px 12px #ff8a2a66}
.wrap{position:relative;z-index:5;max-width:460px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 16px 40px}
h1{font-size:44px;text-align:center}
.sub{text-align:center;font:500 20px "Mitr";color:#fff;margin:4px 0 18px;text-shadow:0 0 20px #a066ff}
.exec{display:block;width:max-content;margin:-6px auto 16px;font:600 15px "Mitr";padding:4px 14px;border-radius:99px;color:#1a0d33;background:linear-gradient(135deg,#ffe08a,#ffb347);box-shadow:0 0 16px #ffc86188}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px 12px;border-radius:20px;border:2px solid var(--line);background:var(--card);backdrop-filter:blur(8px);color:var(--ink);cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.pick:active{transform:scale(.96)}
.pick.on{border-color:var(--orange);box-shadow:0 0 0 4px #ff8a2a44,0 0 24px #ff8a2a66;animation:jelly .5s}
.pick .no{position:absolute;left:10px;top:8px;font:600 18px "Mitr";color:var(--orange)}
.av{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#a066ff,#5a2fb0);font:600 38px "Mitr";color:#fff;box-shadow:0 0 0 3px #ffffff22}
.av img{width:100%;height:100%;object-fit:cover}
.pick .nm{font:500 16px "Mitr";text-align:center;line-height:1.3;min-height:1.3em;overflow-wrap:anywhere}
.go{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:100%;margin-top:16px}
.btn{animation:jelly 2.4s ease-in-out infinite}
.btn:disabled{animation:none}
@keyframes jelly{0%,70%,100%{transform:scale(1,1)}76%{transform:scale(1.06,.92)}82%{transform:scale(.95,1.05)}88%{transform:scale(1.03,.97)}}
.state{text-align:center;padding:30px 0}
.state .av{width:150px;height:150px;font-size:70px;margin:0 auto 14px;box-shadow:0 0 0 5px var(--orange),0 0 40px #ff8a2a88;animation:dance 1.2s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-12px)}}
.state b{display:block;font:600 30px "Mitr";color:var(--orange)}
.state .nm{margin-top:6px;font:500 20px "Mitr"}
.err{text-align:center;color:#ff8f9b;min-height:1.2em;margin-top:10px}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="title wave">100 คืนหลอน</h1>
  <div class="sub">โหวตชุดแฟนซี</div>
  <span class="exec" id="exec" hidden>ผู้บริหาร ×5</span>

  <div class="state" id="closed" hidden><b id="closedMsg">ยังไม่เปิดโหวต</b></div>

  <div id="ballot" hidden>
    <div class="grid" id="grid"></div>
    <button class="btn go" id="go" disabled>โหวต</button>
    <div class="err" id="err"></div>
  </div>

  <div class="state" id="voted" hidden>
    <div class="av" id="vAv"></div>
    <b>โหวตแล้ว</b>
    <div class="nm" id="vNm"></div>
  </div>
</main>

<script src="deco.js"></script>
<script type="module">
import { db } from './fb.js';
import { racerList, avatar } from './race.js';
import { ref, onValue, set, update } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const $ = (s) => document.querySelector(s);
const key = new URLSearchParams(location.search).get('k') || '';
$('#exec').hidden = !key;

// One random id per browser, kept in this browser's storage.
function deviceId() {
  let id = '';
  try { id = localStorage.getItem('vote-id') || ''; } catch {}
  if (!id) {
    id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;
    try { localStorage.setItem('vote-id', id); } catch {}
  }
  return id;
}
const id = deviceId();

let racers = racerList(null);
let stage = '';
let open = false;
let ends = 0, offset = 0, endT;
let mine = null;
let pick = 0;

function label(r) { return r.name ? `เบอร์ ${r.n} · ${r.name}` : `เบอร์ ${r.n}`; }

function drawGrid() {
  const grid = $('#grid');
  grid.replaceChildren();
  for (const r of racers) {
    const b = document.createElement('button');
    b.className = 'pick' + (r.n === pick ? ' on' : '');
    b.innerHTML = '<span class="no"></span><span class="av"></span><span class="nm"></span>';
    b.querySelector('.no').textContent = r.n;
    avatar(b.querySelector('.av'), r);
    b.querySelector('.nm').textContent = r.name;
    b.onclick = () => { pick = r.n; drawGrid(); };
    grid.append(b);
  }
  $('#go').disabled = !pick;
  $('#go').textContent = pick ? `โหวต ${label(racers[pick - 1])}` : 'โหวต';
}

function render() {
  $('#voted').hidden = !mine;
  $('#closed').hidden = !!mine || open;
  $('#ballot').hidden = !!mine || !open;
  $('#closedMsg').textContent = !stage || stage === 'show' ? 'ยังไม่เปิดโหวต' : 'ปิดโหวตแล้ว';
  if (mine) {
    const r = racers[mine.n - 1];
    avatar($('#vAv'), r);
    $('#vNm').textContent = label(r);
  } else if (open) {
    drawGrid();
  }
}

$('#go').onclick = async () => {
  if (!pick) return;
  $('#go').disabled = true;
  $('#err').textContent = '';
  const ballot = { n: pick, w: key ? 5 : 1 };
  try {
    if (key) await update(ref(db, 'vote'), { [`proof/${id}`]: key, [`ballots/${id}`]: ballot });
    else await set(ref(db, `vote/ballots/${id}`), ballot);
  } catch {
    $('#err').textContent = 'โหวตไม่สำเร็จ';
    $('#go').disabled = false;
  }
};

onValue(ref(db, 'vote/racers'), (s) => { racers = racerList(s.val()); render(); });
// Open only while the staff timer runs; re-check the moment it ends.
function sync() {
  const left = ends - (Date.now() + offset);
  open = stage === 'open' && left > 0;
  clearTimeout(endT);
  if (open) endT = setTimeout(sync, left + 50);
  render();
}
onValue(ref(db, '.info/serverTimeOffset'), (s) => { offset = s.val() || 0; sync(); });
onValue(ref(db, 'vote/ends'), (s) => { ends = s.val() || 0; sync(); });
onValue(ref(db, 'vote/stage'), (s) => { stage = s.val() || ''; sync(); });
onValue(ref(db, `vote/ballots/${id}`), (s) => { mine = s.val(); render(); });
</script>
</body>
</html>
