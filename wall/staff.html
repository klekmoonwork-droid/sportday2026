<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 คืนหลอน · พนักงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wall.css">
<style>
.moon,.castle,.fog{display:none}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:#0f0820e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.stat{flex:1;display:flex;gap:8px}
.stat div{padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font:500 13px "Mitr";color:var(--muted)}
.stat b{display:block;font:600 24px/1.1 "Mitr";color:var(--ink)}
.stat .o b{color:var(--orange)}
.top .btn{padding:10px 14px;font-size:15px}
.list{position:relative;z-index:5;max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.item{border-radius:20px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(8px);overflow:hidden;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.item img{display:block;width:100%;max-height:60vh;object-fit:contain;background:#05020d}
.item .t{padding:12px 14px 0}
.item .ig{font:600 17px "Mitr";color:var(--purple)}
.item .q{margin-top:4px;font-size:17px;line-height:1.5;overflow-wrap:anywhere}
.item .act{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.no{background:linear-gradient(135deg,#ff5468,#c8102e);box-shadow:0 6px 0 #7a0a1c}
.no:active{box-shadow:0 2px 0 #7a0a1c}
.yes{background:linear-gradient(135deg,#3ddc84,#119a52);box-shadow:0 6px 0 #0b5e33}
.yes:active{box-shadow:0 2px 0 #0b5e33}
.empty{text-align:center;padding:60px 0;color:var(--muted);font:500 20px "Mitr"}
</style>
</head>
<body>
<header class="top">
  <div class="stat">
    <div class="o"><b id="nIn">0</b>รอตรวจ</div>
    <div><b id="nQ">0</b>คิวจอ</div>
  </div>
  <button class="btn ghost" id="skip">ข้ามคนบนจอ</button>
</header>
<main class="list" id="list"></main>

<script src="deco.js"></script>
<script type="module">
import { db, requireLogin } from './fb.js';
import { ref, onValue, update, remove, set, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const $ = (s) => document.querySelector(s);
const items = new Map();

function card(id, v) {
  const el = document.createElement('article');
  el.className = 'item';
  el.innerHTML = `<img alt=""><div class="t"><div class="ig"></div><div class="q"></div></div>
    <div class="act"><button class="btn no">ไม่ผ่าน</button><button class="btn yes">ผ่าน</button></div>`;
  el.querySelector('img').src = v.img;
  el.querySelector('.ig').textContent = v.ig ? `@${v.ig}` : '';
  el.querySelector('.q').textContent = v.quote || '';
  el.querySelector('.no').onclick = () => remove(ref(db, `inbox/${id}`));
  el.querySelector('.yes').onclick = () => update(ref(db), { [`approved/${id}`]: v, [`inbox/${id}`]: null });
  return el;
}

function render(list) {
  const box = $('#list');
  const keep = new Set(list.map(([id]) => id));
  for (const [id, el] of items) if (!keep.has(id)) { el.remove(); items.delete(id); }
  for (const [id, v] of list) if (!items.has(id)) { const el = card(id, v); items.set(id, el); box.append(el); }
  $('#nIn').textContent = list.length;
  if (!list.length) box.innerHTML = '<div class="empty">ว่าง</div>';
  else box.querySelector('.empty')?.remove();
}

requireLogin(() => {
  onValue(ref(db, 'inbox'), (snap) => {
    const list = [];
    snap.forEach((c) => { list.push([c.key, c.val()]); });
    render(list);
  });
  onValue(ref(db, 'approved'), (snap) => { $('#nQ').textContent = snap.size; });
  $('#skip').onclick = () => set(ref(db, 'skip'), serverTimestamp());
});
</script>
</body>
</html>
